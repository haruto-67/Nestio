# nginxリバースプロキシ設定（Pi上のホストnginxに配置する。Docker内には含めない）。
# certbotでTLS証明書を発行した後、このファイルの内容をベースに
# /etc/nginx/sites-available/nestio.conf 等へ配置し、以下を必ず含める。
# 詳細な手順は docs/manual-setup.md C章参照。

server {
    listen 80;
    server_name nestio.niwatorimc.com;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name nestio.niwatorimc.com;

    # certbotが自動で書き込むssl_certificate/ssl_certificate_keyに加えて、以下を必ず含める
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_stapling on;
    ssl_stapling_verify on;
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 12m;

    # SSEはバッファリングを切らないと差分が届かない（sync-protocol.md 7章）
    location /api/v1/sync/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 添付の実体配信（APIがX-Accel-Redirectで指定する。CLAUDE.md絶対原則9のnosniffはAPI側で付与する）。
    # docker-compose.ymlのnestio-dataボリュームはホストの/var/lib/nestioへbindしているため、
    # Docker内部の不透明なパスに依存せずこのパスをそのまま参照できる。
    location /internal-attachments/ {
        internal;
        alias /var/lib/nestio/attachments/;
    }

    # それ以外は全てAPIコンテナへ（apps/api/src/app.tsがビルド済みPWAの静的配信も兼ねる）
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
