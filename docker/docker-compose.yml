services:
  nestio:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    # 127.0.0.1縛りが必須。`3000:3000`と書くとDockerがiptablesを直接書き換えてufwを貫通する
    # （CLAUDE.md「ビルド上の注意」）。外部公開はホストのnginxがリバースプロキシする。
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    volumes:
      - nestio-data:/var/lib/nestio
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  # SQLiteファイルと添付ディレクトリはnamed volumeに置く。rcloneマウント等のネットワークFS等の
  # ネットワークFS上に直接置くとロックが壊れてDBが破損するため絶対に避ける
  # （CLAUDE.md「ビルド上の注意」）。
  # ホスト側のnginx（X-Accel-Redirectでの添付配信）とバックアップcronが直接ファイルを読む必要が
  # あるため、Dockerが内部管理する不透明なパスではなく、ホストの決まったパス（/var/lib/nestio）に
  # bindするlocalドライバを使う（docs/manual-setup.md C-3/C-5と一致させる）。
  nestio-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/nestio
